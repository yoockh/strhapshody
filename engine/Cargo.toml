[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "strhapshody core logic engine: deterministic, camera-free, mic-free game logic compiled to WASM (hex geometry, gesture classification, strum detection, power chord math, One Euro smoothing, distortion curves)."
license = "MIT"
repository = "https://github.com/yoockh/strhapshody"

[lib]
# cdylib: the wasm artifact wasm-pack ships to the frontend.
# rlib:   lets `cargo test` build and run the pure-logic unit tests natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
# Small, fast wasm for the browser.
opt-level = "s"
lto = true
